<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Learning Platform</title>
</head>
<center>
    <body>
        <h1>Registration Form</h1>
        <h4>Welcome to the Registration Form! Please register to continue.</h4>
    
        <form>
            <label for="full_name">Full Name:</label>
            <input type="name" id="full_name" placeholder="Full Name" required><br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" placeholder="Email Address" required><br><br>

            <label for="age">Age:</label>
            <input type="age" id="age" placeholder="Age" required><br><br>

            <label for="user_name">Username:</label>
            <input type="username" id="user_name" placeholder="Username" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Password" minlength="8" required><br><br>

            <label for="confpassword">Confirm Password:</label>
            <input type="password" id="confpassword" placeholder="Confirm Password" minlength="8" required><br><br>

            <label for="bio">Short Introduction / Bio:</label><br>
            <textarea id="bio" name="bio" rows="4" cols="30"placeholder="Tell us something about yourself..."></textarea><br><br>

            <input type="checkbox" id="agree" required>
            <label for="agree"> I agree to the Terms and Conditions.</label><br><br>


            <button type="submit">Register</button><br><br>
        </form>
    </body>
</center>

</html>
